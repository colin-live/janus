[package]
name = "coupling-config"
description = "Block B3: YAML project/binding/model config parsing, validation, SI conversion"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
coupling-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 0.9 is deprecated upstream but maintained enough for a frozen schema;
# it is the YAML backend already available in the workspace cache. See B3 status notes.
serde_yaml = "0.9"
log = "0.4"
thiserror = "2"
